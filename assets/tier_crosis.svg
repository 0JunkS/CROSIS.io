<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crosisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="30%" stop-color="#ff0000"/>
      <stop offset="70%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#9900ff"/>
    </linearGradient>
    <filter id="crosisGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Flame Horns Background -->
  <path d="M 15 35 Q 5 5 30 15 Q 50 25 70 15 Q 95 5 85 35 Z" fill="#ff0055" filter="url(#crosisGlow)"/>
  <polygon points="50,2 98,26 84,92 50,100 16,92 2,26" fill="url(#crosisGrad)" stroke="#ffffff" stroke-width="4"/>
  <!-- Crown & Crest -->
  <path d="M 25 50 L 35 25 L 50 40 L 65 25 L 75 50 Z" fill="#ffd700" stroke="#000" stroke-width="2"/>
  <text x="50" y="75" font-family="sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" filter="url(#crosisGlow)">CROSIS</text>
</svg>
